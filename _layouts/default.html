<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip_newlines | strip }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke-width="3.2"><ellipse cx="11" cy="16" rx="6" ry="9" stroke="var(--matrix)"/><ellipse cx="21" cy="16" rx="6" ry="9" stroke="var(--lipid)"/></g></svg>
        Norris Lab
      </a>
      <nav aria-label="Main">
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/#publications' | relative_url }}">Publications</a>
        <a href="{{ '/#people' | relative_url }}">People</a>
        <a href="{{ '/#join' | relative_url }}">Join</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <p>Norris Lab, Department of Biochemistry, Temerty Faculty of Medicine, University of Toronto</p>
      <p>
        <a href="{{ site.pi.scholar }}">Google Scholar</a>
        <a href="{{ site.pi.pubmed }}">PubMed</a>
        <a href="{{ site.pi.faculty_page }}">Faculty profile</a>
      </p>
    </div>
  </footer>
  <script src="{{ '/assets/js/lattice.js' | relative_url }}" defer></script>
</body>
</html>
